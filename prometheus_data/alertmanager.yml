global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'alert-dashboard'

  routes:
    - match:
        severity: critical
      receiver: 'alert-dashboard'
      continue: true
    - match:
        severity: warning
      receiver: 'alert-dashboard'

receivers:
  - name: 'alert-dashboard'
    webhook_configs:
      - url: 'http://alert-dashboard:5000/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
